name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install pnpm
        env:
          PNPM_VERSION: '11.9.0'
        run: npm install --global "pnpm@$PNPM_VERSION"

      - name: Install go-task
        env:
          TASK_VERSION: '3.53.1'
          TASK_SHA256: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/bin" task
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install aep
        env:
          AEP_VERSION: '0.68.0'
          AEP_SHA256: 02bf6a2c4bc9a3ffd717edfb365f665491005004f159774a8847d3cbd18c5e91
        run: |
          set -o pipefail
          archive="aep-$AEP_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/beyond10x/aep/releases/download/$AEP_VERSION/$archive.tar.gz"
          echo "$AEP_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/aep" "$RUNNER_TEMP/bin/aep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: '0.53.0'
          ESS_SHA256: 40e8c9acd9bb5016387215cb5461090eb4765805ce7c8858d4b02284e6908914
        run: |
          set -o pipefail
          archive="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$archive.tar.gz"
          echo "$ESS_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/ess" "$RUNNER_TEMP/bin/ess"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Gate
        run: task check

      - name: Build the web app, then the release binary with it embedded
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build-home --remap-path-prefix=$GITHUB_WORKSPACE=/repoview"
          task build

      - name: Package the Linux build
        id: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          package="repoview-${GITHUB_SHA::7}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          files=(repoview README.md)
          cp target/release/repoview README.md "dist/$package/"
          if [ -f LICENSE ]; then
            cp LICENSE "dist/$package/"
            files+=(LICENSE)
          fi
          tar -czf "dist/$package.tar.gz" -C "dist/$package" "${files[@]}"
          echo "name=$package" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
